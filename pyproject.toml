[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dlmrel"
version = "0.1.0"
description = "Do diffusion LM attention heads track grammatical relations, or positions?"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "conllu>=4.5",
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "pyyaml>=6.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
# Pinned to the transformers version the DiffuLLaMA repo was written against;
# later versions changed the attention-implementation plumbing that
# `output_attentions` depends on.
gpu = [
    "torch>=2.1",
    "transformers==4.44.2",
    "accelerate>=0.30",
    "sentencepiece>=0.1.99",
    "huggingface-hub>=0.23,<0.37",
]
# Dream is Qwen2-based and ships its own modelling code, which needs a
# transformers new enough to have the RoPE/attention plumbing it expects. This
# pin is deliberately incompatible with `gpu` above: the two model families
# cannot share a runtime, and a wrong pin fails at load rather than silently
# returning no attention weights.
dream = [
    "torch>=2.1",
    "transformers==4.51.3",
    "accelerate>=0.30",
    "safetensors>=0.4",
]
dev = ["pytest>=7.4", "ruff>=0.5"]

[project.scripts]
dlmrel = "dlmrel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
