[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dlmrel"
version = "0.1.0"
description = "Linguistic-relation analysis for diffusion language models"
requires-python = ">=3.10"
dependencies = [
  "conllu>=6,<7",
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "pyarrow>=15,<20",
  "pyyaml>=6,<7",
  "scipy>=1.11,<2",
  "torch>=2.2,<3",
  "tqdm>=4.66,<5",
]

[project.optional-dependencies]
dream = ["transformers==4.51.3", "accelerate", "sentencepiece"]
diffugpt = ["transformers==4.44.2", "accelerate"]
diffullama = ["transformers==4.44.2", "accelerate", "sentencepiece"]
llada = ["transformers", "accelerate", "sentencepiece"]
probe = ["scikit-learn>=1.4,<2"]
dev = ["pytest>=8,<9", "ruff>=0.6,<1"]

[project.scripts]
dlmrel = "dlmrel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: requires a real model and GPU"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
