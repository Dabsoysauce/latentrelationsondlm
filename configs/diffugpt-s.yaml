# DiffuGPT-S (12L x 12H = 144 heads) over the same splits as default.yaml.
#
# Two uses:
#   1. End-to-end smoke test before spending time on the 7B. This model's
#      answer is already known -- L4 H0 should come out top for object->verb
#      at roughly 0.75 -- so a wrong number here means the pipeline is broken,
#      not the science.
#   2. The small-model arm of the paper. The pilot DiffuGPT-S numbers came from
#      the old pipeline, so they cannot share a table with new 7B numbers until
#      this model is re-scored on these splits.
#
# Everything except the model block is identical to default.yaml, deliberately.

treebank:
  treebanks:
    - UD_English-EWT
  cache_dir: data/ud
  n_select: 4000
  n_dev: 1000
  n_test: 1000
  max_seq_len: 128
  min_seq_len: 4
  shuffle: true
  seed: 42
  skip_multiword: true
  require_full_alignment: true
  # Score both models on identical sentences.
  common_pool_models:
    - diffusionfamily/diffugpt-s
    - diffusionfamily/diffullama

model:
  name: diffusionfamily/diffugpt-s
  family: diffugpt
  dtype: float32
  device: cuda
  # Must stay "eager": sdpa and flash_attention_2 return no attention weights.
  attn_implementation: eager

diffusion:
  steps: 64
  seed: 42
  seeds: [42, 43, 44, 45, 46]
  include_bos: true
  exclude_bos: true
  exclude_self: true
  attender_token: last
  min_masked_positions: 25

analysis:
  offset_range: [-15, 15]
  n_bootstrap: 10000
  ci: 0.95
  distance_bins: [1, 2, 3, 5, 8, 100]

out_dir: results/diffugpt-s-ewt
