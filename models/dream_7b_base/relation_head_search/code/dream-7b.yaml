treebank:
  treebanks:
    - UD_English-EWT
  cache_dir: data/ud
  n_select: 4000
  n_dev: 1000
  n_test: 1000
  max_seq_len: 128
  min_seq_len: 4
  shuffle: true
  seed: 42
  skip_multiword: true
  require_full_alignment: true
  common_pool_models:
    - diffusionfamily/diffugpt-s
    - diffusionfamily/diffullama
    - Dream-org/Dream-v0-Base-7B

model:
  name: Dream-org/Dream-v0-Base-7B
  family: dream
  dtype: bfloat16
  device: cuda
  attn_implementation: eager

diffusion:
  steps: 64
  seed: 42
  seeds: [42, 43, 44]
  include_bos: true
  exclude_bos: true
  exclude_self: true
  attender_token: last
  min_masked_positions: 25
  timestep_stride: 8
  n_curve_sentences: null
  n_probe_sentences: 400
  probe_layer_stride: 4

analysis:
  offset_range: [-15, 15]
  n_bootstrap: 10000
  ci: 0.95
  distance_bins: [1, 2, 3, 5, 8, 100]

out_dir: results/dream-7b-ewt
